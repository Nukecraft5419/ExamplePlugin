# ----------------------------------------------------
# Modern Adventure MiniMessage Format
# ----------------------------------------------------
# We use MiniMessage as our primary engine.
# This allows for RGB colors, gradients, click events, and safer parsing.
#
# ✨ LEGACY SUPPORT (THE BRIDGE):
# Don't worry! You can still use classic '&' color codes (e.g., &6, &l)
# and Hex codes (e.g., &#FF0000). Our engine automatically converts
# them into modern MiniMessage tags without breaking gradients.
#
# ⚠️ IMPORTANT RULE (XML-Style Syntax):
# When you use MiniMessage tags (like <red>), it is best practice
# to close them (</red>) so they don't bleed into the rest of the text.
# Example: "<gray>This is gray, </gray><green>this is green!</green>"
#
# 🛠️ USEFUL TOOLS & LINKS:
# - MiniMessage Web Editor (Test your messages live!):
#   https://webui.advntr.dev/
# - PlaceholderAPI Official Placeholder List:
#   https://wiki.placeholderapi.com/users/placeholder-list/minecraft/
#
# Standard Colors:
# <black>, <dark_blue>, <dark_green>, <dark_aqua>, <dark_red>, <dark_purple>,
# <gold>, <gray>, <dark_gray>, <blue>, <green>, <aqua>, <red>, <light_purple>,
# <yellow>, <white>
#
# Formatting:
# <obfuscated>, <bold>, <strikethrough>, <underlined>, <italic>, <reset>
#
# Custom Plugin Tags (Internal):
# <prefix>             - The prefix of the plugin
# <author>             - The author of the plugin
# <version>            - The version of the plugin
# <name>            - The display name of the player
# <server_version>     - The version of the server
# <server_api_version> - The API version of the server
#
# External Placeholders (PlaceholderAPI):
# %ep_version%         - The version of the plugin (via PAPI)
# %ep_name%            - The display name of the player (via PAPI)
# ----------------------------------------------------

#╔════════════════════╗
#║ ● Plugin Message ● ║
#╚════════════════════╝
plugin:
  prefix: "<gold><b>ExamplePlugin</b></gold> <dark_gray>»</dark_gray>"
  hello: "<green>Hello <yellow><name></yellow>!</green>"
  author: "<prefix> <gray>The author of the plugin is:</gray> <yellow><author></yellow>"
  version: "<prefix> <gray>The version of the plugin is the:</gray> <yellow>v<version></yellow>"
  reload: "<prefix> <green>The plugin has been reloaded!</green>"
  help:
    - "<dark_gray><strikethrough>-------------</strikethrough> [<gold><b>ExamplePlugin</b></gold>] <strikethrough>-------------</strikethrough></dark_gray>"
    - "<gray>- <red><click:suggest_command:/exampleplugin help><hover:show_text:'Click to suggest command'>/exampleplugin help</hover></click></red> - <yellow>Show help</yellow></gray>"
    - "<gray>- <red><click:suggest_command:/exampleplugin hello><hover:show_text:'Click to suggest command'>/exampleplugin hello</hover></click></red> - <yellow>Show hello</yellow></gray>"
    - "<gray>- <red><click:suggest_command:/exampleplugin get><hover:show_text:'Click to suggest command'>/exampleplugin get</hover></click></red> - <yellow>Show <author|version></yellow></gray>"
    - "<gray>- <red><click:suggest_command:/exampleplugin reload><hover:show_text:'Click to suggest command'>/exampleplugin reload</hover></click></red> - <yellow>Reload plugin</yellow></gray>"
    - "<dark_gray><strikethrough>------------------------------------------</strikethrough></dark_gray>"

#╔════════════════════╗
#║ ● Errors Message ● ║
#╚════════════════════╝
errors:
  console: "<prefix> <dark_gray><b>(<dark_red>!</dark_red>)</b></dark_gray> <red>This command cannot be executed from the console!</red>"
  no-permission: "<prefix> <dark_gray><b>(<dark_red>!</dark_red>)</b></dark_gray> <red>You don't have permission to execute this command!</red>"
  no-args-get: "<prefix> <dark_gray><b>(<dark_red>!</dark_red>)</b></dark_gray> <yellow>Unknown args!</yellow> <gray>Please use the command</gray> <red>/exampleplugin <author|version></red>"

#╔══════════════════╗
#║ ● Join Message ● ║
#╚══════════════════╝
join:
  message: "<green>Hello <yellow><name></yellow> this is example message join</green>"

#╔═════════════════════════╗
#║ ● Server Info Message ● ║
#╚═════════════════════════╝
server-info:
  message: "<prefix> <gray>Version server: <yellow><server_version></yellow> version plugin: <yellow><version></yellow> version api plugin: <yellow><server_api_version></yellow></gray>"
